name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test
        working-directory: server
        run: go test ./...

  release:
    name: 构建并发布二进制
    needs: test
    # 仅 v* tag 触发：构建 linux/darwin × amd64/arm64 静态二进制，发布到 GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    # amd64 即 x64（x86-64）；产物名用 x64 更直观
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64, name: linux-x64 }
          - { os: linux, arch: arm64, name: linux-arm64 }
          - { os: darwin, arch: amd64, name: darwin-x64 }
          - { os: darwin, arch: arm64, name: darwin-arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 构建静态二进制
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o "../dist/docs-mcp-${{ matrix.name }}" ./cmd/server
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/docs-mcp-${{ matrix.name }}
